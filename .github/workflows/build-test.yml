name: 🔨 Build Test
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test Builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: projectdiscovery/actions/setup/go@v1

      - name: Test
        run: go test ./...

      - name: Build
        run: go build .
        working-directory: cmd/notify/
